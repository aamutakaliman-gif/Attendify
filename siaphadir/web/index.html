<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17404a">
<title>SiapHadir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: attendance board. Brand-colored header band with a soft dot pattern, amber as the one accent. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232a; --mute:#5a6872; --line:#d8dfe3; --soft:#e9eef0;
  --band:#17404a; --band2:#2d5560; --band-ink:#f1f6f7; --band-mute:#a8c3c8;
  --brass:#b7791f; --accent:#17404a; --accent-ink:#ffffff;
  --g-hadir:#2f7d4f; --g-luar:#11807a; --g-tugas:#2a63a8; --g-libur:#ad7710; --g-alpa:#b23a32; --g-belum:#89938c;
  --display:"Plus Jakarta Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11171a; --panel:#182125; --ink:#e4ecef; --mute:#97a7ae; --line:#2b373d; --soft:#212c31;
  --band:#0d2429; --band2:#1b3a41; --band-ink:#f1f6f7; --band-mute:#9fbac0;
  --brass:#f2b33d; --accent:#9fd0d9; --accent-ink:#0b2226;
  --g-hadir:#4cb377; --g-luar:#33b3a9; --g-tugas:#5b95dc; --g-libur:#d8a53c; --g-alpa:#e0645b; --g-belum:#7c8881; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--g-tugas)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
.band{position:relative;background:var(--band);color:var(--band-ink);overflow:hidden}
.band canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band .wrap{position:relative;padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.brandrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:64px;height:64px;flex:none;display:grid;place-items:center}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.brand .eyebrow{color:var(--band-mute)}
.unit{font:800 30px/1.1 var(--display);letter-spacing:-.01em;margin:4px 0 0;overflow-wrap:anywhere}
.whoami{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 14px 4px 4px;font-size:14px;color:var(--band-ink)}
.whoami .av{width:32px;height:32px}
.navrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{display:flex;gap:7px;align-items:center;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--band-mute);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--brass)}
.datenav{display:flex;align-items:center;gap:6px;padding-bottom:8px}
.datenav input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 8px;color:var(--band-ink);color-scheme:dark}
.bbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--band-ink);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:18px 56px;min-width:0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px;width:100%}
.btn.danger{color:var(--g-alpa)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--mute)} .small{font-size:13px}
h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:-.005em;text-wrap:balance}
h3{font:700 16px/1.2 var(--display);margin:0}
.duty{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.duty .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.duty b{display:block}
.me{display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:start}
.me .av{width:64px;height:64px;font-size:22px}
.me-body{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:520px){.me{grid-template-columns:1fr}.me .av{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px 7px 9px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip svg{color:var(--c);width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.chip[aria-pressed="true"] svg{color:#fff}
.pause{border:1px dashed var(--g-libur);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);letter-spacing:.04em;color:#fff;background:var(--c,var(--band2));overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.strength{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strength>div{background:var(--panel);padding:12px 14px;min-width:0}
.strength b{display:block;font:800 40px/1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.strength span{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.strength em{font-style:normal;font-size:12px;color:var(--mute);display:block;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin-top:12px}
.bar i{display:block;height:100%}
@media (max-width:560px){.strength{grid-template-columns:repeat(2,minmax(0,1fr))}.strength b{font-size:38px}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grp-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.grp-h .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.grp-h h3{flex:1}
.grp-h small{font:800 22px/1 var(--display);color:var(--c);font-variant-numeric:tabular-nums}
.person{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--soft);padding:7px 0}
.person:first-of-type{border-top:0}
.person:disabled{cursor:default}
.person .av{width:30px;height:30px;font-size:11px}
.pname{min-width:0}
.pname b{font-weight:600}
.pname div{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;color:var(--g-libur)}
.tag svg{width:13px;height:13px}
.report{font:500 13px/1.55 var(--mono);white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:360px;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:none}
.row>.field{flex:1 1 200px}
.modal .av{width:44px;height:44px;font-size:15px}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
textarea{resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
.sect{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--soft)}
.sect:first-child{border-top:0;padding-top:0}
.sect-h{display:flex;gap:10px;align-items:center}
.sect-h .num{font:700 15px/1 var(--mono);color:var(--brass)}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo .frame{width:96px;height:128px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mute)}
.photo .frame img{width:100%;height:100%;object-fit:cover}
.meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--g-hadir)}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.mx{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.mx th,.mx td{border-bottom:1px solid var(--soft);padding:0;text-align:center;height:30px}
.mx th{font-weight:600;color:var(--mute);padding:4px 2px;position:sticky;top:0;background:var(--panel)}
.mx .nm{position:sticky;left:0;background:var(--panel);text-align:left;padding:0 10px;white-space:nowrap;z-index:1;min-width:170px;border-right:1px solid var(--line)}
.mx .we{background:var(--soft)}
.mx .cell{width:34px;min-width:34px;font:500 10px/1 var(--mono);border:0;background:none;height:30px;display:inline-grid;place-items:center}
.mx .cell span{display:inline-block;padding:3px 2px;border-radius:3px;color:#fff;background:var(--c);min-width:28px}
.mx .tot{padding:0 8px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{font:500 10px/1 var(--mono);font-style:normal;color:#fff;background:var(--c);padding:3px 4px;border-radius:3px}
.roster{width:100%;border-collapse:collapse}
.roster td,.roster th{padding:8px 6px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:middle}
.roster th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.roster .av{width:34px;height:34px;font-size:12px}
.mono{font-family:var(--mono);font-size:13px}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-width:580px;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
/* gate screens: login / setup / server */
.gate{min-height:100vh;min-height:100dvh;position:relative;background:var(--band);color:var(--band-ink);display:grid;place-items:center;padding:24px 16px;overflow:hidden}
.gate canvas{position:absolute;inset:0;width:100%;height:100%}
.gate-card{position:relative;width:100%;max-width:400px;background:var(--panel);color:var(--ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gate-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative}
.gate-head .logo{width:110px;height:110px}
.gate-head .unit{font-size:28px;color:var(--band-ink)}
.pin{letter-spacing:.5em;font:600 22px/1 var(--mono);text-align:center}
.foot{position:relative;margin-top:18px;font-size:12px;color:var(--band-mute);text-align:center}
#opening{position:fixed;inset:0;z-index:50;background:var(--band);color:#f1f6f7;display:grid;place-items:center;overflow:hidden}
#opening canvas{position:absolute;inset:0;width:100%;height:100%}
#opening video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.op-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.op-logo{width:140px;height:140px;display:grid;place-items:center}
.op-logo img{max-width:100%;max-height:100%;object-fit:contain}
.op-name{font:800 clamp(32px,7.5vw,60px)/1.05 var(--display);letter-spacing:-.01em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .35em}
.op-name span{display:inline-block;white-space:pre}
.op-rule{height:3px;width:200px;border-radius:2px;background:#f2b33d;transform-origin:center}
.op-greet{font:600 20px/1.3 var(--display)}
.op-date{font:500 13px/1 var(--mono);letter-spacing:.1em;color:rgba(255,255,255,.7);text-transform:uppercase}
.op-ctl{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.op-ctl button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
<header class="band">
  <canvas id="bandCv" aria-hidden="true"></canvas>
  <div class="wrap gut">
    <div class="brandrow">
      <div class="brand">
        <div class="logo" id="logoBox"></div>
        <div style="min-width:0"><div class="eyebrow" id="modeLbl"></div><div class="unit" id="unitName"></div></div>
      </div>
      <div class="row"><button class="bbtn" id="replayB" title="Putar ulang pembuka"></button><button class="whoami" id="whoami" data-act="akun"></button></div>
    </div>
    <div class="navrow">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="datenav">
        <button class="bbtn" id="prevD" aria-label="Hari sebelumnya">‹</button>
        <input type="date" id="dateIn" aria-label="Tanggal">
        <button class="bbtn" id="nextD" aria-label="Hari berikutnya">›</button>
        <button class="bbtn" id="todayB">Hari ini</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap gut" id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="opening" hidden>
  <canvas id="opCv" aria-hidden="true"></canvas>
  <video id="opVid" playsinline muted hidden></video>
  <div class="op-inner" id="opInner"><div class="op-logo" id="opLogo"></div><div class="op-name" id="opName"></div><div class="op-rule" id="opRule"></div><div class="op-greet" id="opGreet"></div><div class="op-date" id="opDate"></div></div>
  <div class="op-ctl"><button id="opSound" hidden>Nyalakan suara</button><button id="opSkip">Lewati</button></div>
</div>

const APP = 'SiapHadir';

  grid:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17.5h2"/>',

function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const apiBase = () => NATIVE ? (ls.get('server')||'').replace(/\/+$/,'') : '';
async function api(method, url, body, raw){
  const opt = { method, headers:{} };
  const tok = ls.get('token'); if (tok) opt.headers.Authorization = 'Bearer '+tok;
  if (raw){ opt.body = raw; opt.headers['Content-Type'] = raw.type || 'application/octet-stream'; }
  else if (body !== undefined){ opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  let r;
  try { r = await fetch(apiBase()+url, opt); }
  catch(e){ throw Object.assign(new Error('Tidak tersambung ke server. Periksa sinyal atau alamat server.'), {offline:true}); }
  const data = await r.json().catch(()=>({}));
  if (r.status === 401 && url !== '/api/login'){ ls.set('token', null); resetSession(); showGate('login'); }
  if (!r.ok) throw Object.assign(new Error(data.error || ('Gagal ('+r.status+')')), {status:r.status});
  return data;
}

function getGps(){
  return new Promise(res=>{
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}), ()=>res(null), {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}

async function scheduleReminder(){
  const C = window.Capacitor;
  const LN = NATIVE && C ? (C.Plugins && C.Plugins.LocalNotifications) || (C.registerPlugin && C.registerPlugin('LocalNotifications')) : null;
  if (!LN) return;
  try{
    const perm = await LN.requestPermissions(); if (perm.display!=='granted') return;
    const j=S.meta.jam||DEF_JAM, m=Math.max(0,hm2min(j.mulai)-15);
    const pending = await LN.getPending(); if (pending.notifications.length) await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
    await LN.schedule({notifications:j.hari.map(d=>({id:100+d, title:'Waktunya lapor kehadiran', body:'Buka '+APP+' dan ketuk status Anda hari ini.', schedule:{on:{weekday:d+1,hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}}))});
  }catch(e){}
}

/* ---------- latar pola titik ---------- */
function drawContours(cv, seed, stroke, alpha){
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,r.width,r.height);
  const rnd=mulberry(seed), gap=22, cx=r.width*(.7+rnd()*.25), cy=r.height*(.2+rnd()*.3), R=Math.max(r.width,r.height)*.75;
  ctx.fillStyle='#ffffff';
  for (let y=gap/2;y<r.height;y+=gap) for (let x=gap/2;x<r.width;x+=gap){
    const d=Math.hypot(x-cx,y-cy)/R; const a=alpha*Math.max(0,1-d)*1.6; if(a<.02) continue;
    ctx.globalAlpha=Math.min(.5,a); ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

async function start(){
  if (NATIVE && !ls.get('server')) return showGate('server');
  try{ gateInfo=await api('GET','/api/status'); applyBrand(gateInfo.warna); }
  catch(e){ if (NATIVE) { toast(e.message); return showGate('server'); } document.getElementById('gate').hidden=false; document.getElementById('gate').innerHTML=`<div class="gate"><div class="gate-card"><h2>Server tidak terjangkau</h2><p class="muted">${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">Coba lagi</button></div></div>`; return; }
  if (gateInfo.setup) return showGate('setup');
  if (!ls.get('token')) return showGate('login');
  try{ const s=await load(); if (s.me.must_change) return showGate('pin'); }
  catch(e){ if(e.status===401) return; toast(e.message); return; }
  document.getElementById('gate').hidden=true; document.getElementById('app').hidden=false;
  drawContours(document.getElementById('bandCv'),7,'#ffffff',.22);
  render(); startPolling(); scheduleReminder();
  if (!ss.get('op-seen')) playOpening();
}

const greetWord = () => { const h=new Date().getHours(); return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'; };
function playOpening(){
  ss.set('op-seen','1');
  const op=document.getElementById('opening'), vid=document.getElementById('opVid'), inner=document.getElementById('opInner'), sound=document.getElementById('opSound');
  op.hidden=false; let done=false; const timers=[];
  const close=()=>{ if(done) return; done=true; timers.forEach(clearTimeout); vid.pause();
    const a=op.animate([{opacity:1},{opacity:0}],{duration:450,easing:'ease-in'}); a.onfinish=()=>{ op.hidden=true; vid.hidden=true; inner.hidden=false; sound.hidden=true; }; };
  document.getElementById('opSkip').onclick=close;
  const fallback=()=>{ vid.hidden=true; inner.hidden=false; sound.hidden=true; runAnim(); };
  if (S.meta.video){
    inner.hidden=true; vid.hidden=false; vid.src=apiBase()+'/media/video'; vid.currentTime=0; sound.hidden=false;
    sound.onclick=()=>{ vid.muted=false; sound.hidden=true; };
    vid.onended=close; vid.onerror=fallback; vid.play().catch(fallback); return;
  }
  runAnim();
  function runAnim(){
    const cv=document.getElementById('opCv'); drawContours(cv,11,'#ffffff',.28);
    const logo=document.getElementById('opLogo'), name=document.getElementById('opName'), rule=document.getElementById('opRule'), greet=document.getElementById('opGreet'), date=document.getElementById('opDate');
    logo.innerHTML=logoHTML();
    name.innerHTML=(S.meta.nama||APP).toUpperCase().split(/\s+/).filter(Boolean).map(w=>`<span class="w">${[...w].map(ch=>`<span class="l">${esc(ch)}</span>`).join('')}</span>`).join('');
    const letters=[...name.querySelectorAll('.l')];
    const p=S.personel.find(x=>x.id===myPid());
    greet.textContent=greetWord()+', '+(p?label(p):'Pegawai'); date.textContent=longDate(todayISO());
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){ timers.push(setTimeout(close,1600)); return; }
    const E='cubic-bezier(.2,.8,.2,1)', O='cubic-bezier(.34,1.56,.64,1)';
    cv.animate([{opacity:0,transform:'scale(1.08)'},{opacity:1,transform:'scale(1)'}],{duration:2400,easing:E,fill:'both'});
    logo.animate([{opacity:0,transform:'scale(.55) rotate(-6deg)'},{opacity:1,transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:900,delay:250,easing:O,fill:'both'});
    letters.forEach((s,i)=>s.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'translateY(0)'}],{duration:520,delay:850+i*55,easing:O,fill:'both'}));
    const t2=850+letters.length*55+250;
    rule.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:600,delay:t2,easing:E,fill:'both'});
    greet.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:500,delay:t2+300,easing:E,fill:'both'});
    date.animate([{opacity:0},{opacity:1}],{duration:500,delay:t2+500,easing:E,fill:'both'});
    timers.push(setTimeout(close,t2+2200));
  }
}

function computeDay(s){
  const rows=sortedPersonel().map(p=>({p,st:statusOf(p.id,s)}));
  const by={}; rows.forEach(r=>{ const k=r.st?r.st.k:'_'; (by[k] ||= []).push(r); });
  const hadir=rows.filter(r=>r.st&&sk(r.st.k).h).length, markas=rows.filter(r=>r.st&&sk(r.st.k).g==='hadir').length;
  return {rows,by,jml:rows.length,hadir,markas,luar:hadir-markas,kurang:rows.length-hadir,belum:(by['_']||[]).length};
}

async function guard(fn, okMsg){

let toastT;
function toast(msg){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true},3200); }
async function copyText(txt, selId){
  try{ await navigator.clipboard.writeText(txt); toast('Tersalin'); }
  catch(e){ const el=selId&&document.getElementById(selId); if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Teks sudah dipilih, salin manual'); } else toast('Penyalinan ditolak'); }
}
function resizeImage(file, w, h, type, q){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const c=document.createElement('canvas');
      if (h){ c.width=w; c.height=h; const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s; c.getContext('2d').drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh); }
      else { const s=Math.min(1,w/Math.max(img.width,img.height)); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); }
      URL.revokeObjectURL(url); res(c.toDataURL(type,q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('File bukan gambar')); }; img.src=url; });
}

  if (act==='copy') return copyText(reportText(computeDay(S.date)),'reportTxt');
  if (act==='csv') return copyText(rekapTSV());
  if (act==='unit'){ if(await guard(()=>api('POST','/api/meta',{nama:document.getElementById('unitIn').value.trim()}),'Nama organisasi disimpan')) load(); return; }
  if (act==='nologo'){ if(await guard(()=>api('POST','/api/meta',{logo:''}),'Logo dihapus')) load(); return; }
  if (act==='novid'){ if(await guard(()=>api('POST','/api/meta',{video:false}),'Kembali ke animasi bawaan')) load(); return; }
  if (act==='replay') return playOpening();
  if (act==='warna'){ if(await guard(()=>api('POST','/api/meta',{warna:document.getElementById('warnaIn').value}),'Warna disimpan')) load(); return; }
  if (act==='stadd'){ harvestStatus(); stEdit.push({k:'',l:'',g:'hadir',ph:'',aktif:true}); lastKey=''; render(); return; }
  if (act==='stdel'){ harvestStatus(); stEdit.splice(Number(a.dataset.i),1); lastKey=''; render(); return; }
  if (act==='stsave'){ harvestStatus(); if(await guard(()=>api('POST','/api/meta',{status:stEdit}),'Status disimpan')){ stEdit=null; lastKey=''; await load(); } return; }
  if (act==='preset'){
    if (!presetConfirm){ presetConfirm=true; lastKey=''; return render(); }
    presetConfirm=false; if(await guard(()=>api('POST','/api/meta',{preset:document.getElementById('presetSel').value}),'Paket status dipasang')){ stEdit=null; lastKey=''; await load(); } return;
  }
  if (act==='savejam'){
    const mulai=document.getElementById('jMulai').value, selesai=document.getElementById('jSelesai').value, hari=[0,1,2,3,4,5,6].filter(d=>document.getElementById('jh'+d).checked);
    if (await guard(()=>api('POST','/api/meta',{jam:{mulai,selesai,hari}}),'Jam kerja disimpan')){ await load(); scheduleReminder(); } return;
  }
  if (act==='editp') return openPerson(a.dataset.pid);
  if (act==='biofor'){ S.bioTarget=a.dataset.pid; S.tab='biodata'; return render(); }
  if (act==='applybio'){
    const pid=document.getElementById('bioForm').dataset.pid, p=S.personel.find(x=>x.id===pid), b=collectBio();
    if (!p||!b.nama) return toast('Nama wajib diisi');
    if (await guard(()=>api('POST','/api/personel',{id:pid,nama:b.nama,pangkat:b.pangkat,nrp:b.nrp,jabatan:b.jabatan,urut:p.urut}),'Daftar pegawai diperbarui')) load(); return;
  }
  if (act==='add'){
    const v=id=>document.getElementById(id).value.trim(); if(!v('fNama')||!v('fNrp')) return toast('Nama dan nomor induk wajib diisi');
    const urut=Math.max(0,...S.personel.map(p=>p.urut<999?p.urut:0))+1;
    await guard(async()=>{ const r=await api('POST','/api/personel',{pangkat:v('fPkt'),nama:v('fNama'),nrp:v('fNrp'),jabatan:v('fJab'),urut});
      if (r.pin) pinTable([{nama:(v('fPkt')?v('fPkt')+' ':'')+v('fNama'),nrp:v('fNrp'),pin:r.pin}]); else toast('Data diperbarui');
      ['fPkt','fNama','fNrp','fJab'].forEach(id=>{ document.getElementById(id).value=''; }); await load(); });
  }
  if (act==='bulk'){
    // Jangan memangkas tab di awal baris: kolom Golongan yang kosong harus tetap jadi kolom pertama.
    // 4 kolom = Golongan, Nama, Nomor induk, Jabatan; 3 kolom = Nama, Nomor induk, Jabatan.
    const rows=document.getElementById('bulkIn').value.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()).map(l=>{ const c=l.split(/\t|;/).map(x=>x.trim()); return c.length>=4?c.slice(0,4):c.length===3?['',...c]:null; }).filter(Boolean);
    if (!rows.length) return toast('Tempel daftar dulu (kolom: Nama, Nomor induk, Jabatan, boleh diawali Golongan)');
    await guard(async()=>{ const r=await api('POST','/api/personel/import',{rows}); document.getElementById('bulkIn').value=''; await load();
      if (r.pins.length) pinTable(r.pins); else toast('Data diperbarui, tidak ada pegawai baru'); });
  }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.person[data-act]')){ e.preventDefault(); e.target.click(); } if(e.key==='Escape') closeModal(); });
document.addEventListener('submit', async e=>{
  if (e.target.id!=='bioForm') return; e.preventDefault();
  const f=e.target, b=collectBio();
  const miss=BIO_FIELDS.filter(([k,,,o={}])=>o.req && !b[k]).map(([,l])=>l);
  if (miss.length) return toast('Lengkapi: '+miss.slice(0,3).join(', ')+(miss.length>3?', dan lainnya':''));
  if (!document.getElementById('b_benar').checked) return toast('Centang pernyataan kebenaran data dulu');
  const prev=bioFor(f.dataset.pid)||{};
  if (await guard(()=>api('POST','/api/bio',{pid:f.dataset.pid,data:{...b,foto:pendingFoto??prev.foto??''}}),'Biodata tersimpan')){ pendingFoto=null; load(); }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if (t.id==='bioSel'){ S.bioTarget=t.value||null; pendingFoto=null; return render(); }
  if (!t.files || !t.files[0]) return;
  const file=t.files[0];
  try{
    if (t.id==='fotoIn'){ pendingFoto=await resizeImage(file,300,400,'image/jpeg',.82); document.getElementById('fotoFrame').innerHTML=`<img src="${pendingFoto}" alt="Foto">`; toast('Foto siap. Tekan Simpan biodata.'); }
    if (t.id==='logoIn'){ const d=await resizeImage(file,320,0,'image/png'); if(await guard(()=>api('POST','/api/meta',{logo:d}),'Logo terpasang')) load(); }
    if (t.id==='vidIn'){ if(file.size>60e6) return toast('Video maksimal 60 MB'); toast('Mengunggah video…'); if(await guard(()=>api('POST','/api/video',undefined,file),'Video pembuka terpasang')) load(); }
  }catch(err){ toast('Gagal: '+(err.message||'coba file lain')); }
  t.value='';
});
const setDate=s=>{ if(!s) return; S.date=s; if (monthOf(s)!==loadedBln) load().catch(e=>toast(e.message)); else render(); };
document.getElementById('dateIn').addEventListener('change',e=>setDate(e.target.value));
document.getElementById('prevD').addEventListener('click',()=>setDate(addDays(S.date,-1)));
document.getElementById('nextD').addEventListener('click',()=>setDate(addDays(S.date,1)));
document.getElementById('todayB').addEventListener('click',()=>setDate(todayISO()));
document.getElementById('replayB').addEventListener('click',()=>playOpening());
start();
</script>
</body>
</html>
