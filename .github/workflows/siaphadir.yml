name: SiapHadir

on:
  push:
    paths: ['siaphadir/**', '.github/workflows/siaphadir.yml']
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
        working-directory: siaphadir/server

  build-apk:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Bangun APK
        working-directory: siaphadir/mobile
        run: |
          npm ci
          npm run sync
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SiapHadir-apk
          path: siaphadir/mobile/android/app/build/outputs/apk/debug/app-debug.apk
